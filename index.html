function cab(){document.getElementById("quien").textContent=turno?"Turno: "+turno.nombre:me.nombre+" · "+me.rol;document.getElementById("nav").className="";document.getElementById("so").className="small";var b=document.getElementById("et");b.className="small";b.textContent=turno?"Entregar turno":"Iniciar turno"}
function turnoBtn(){if(turno)entregar();else{sinTurno=false;vistaTurno()}}
async function entregar(){if(!confirm("¿Entregar el turno de "+turno.nombre+"?"))return;var r=await sb.rpc("cerrar_turno");if(r.error){err="No se pudo cerrar el turno: "+r.error.message;render();return}await vistaTurno()}
async function vistaTurno(){resumen=false;enTurno=true;turno=null;selC=null;pin="";terr="";document.getElementById("nav").className="hid";document.getElementById("et").className="small hid";document.getElementById("so").className="small";document.getElementById("quien").textContent=me.nombre+" · "+me.rol;var r=await sb.from("conserjes").select("id,nombre").eq("activo",true).order("nombre");cs=r.data||[];if(r.error)terr="No se pudo cargar la lista: "+r.error.message;pintaTurno()}
function pintaTurno(){var m=document.getElementById("main"),h,E='<div class="err">'+esc(terr)+'</div>';
if(!selC){h='<div class="card"><b>¿Quién está de turno?</b><p class="meta">Selecciona tu nombre para iniciar el turno.</p><div class="cgrid">'+(cs.length?cs.map(function(c){return '<button class="btn sec cbtn" onclick="elegir(\''+c.id+'\')">'+esc(c.nombre)+'</button>'}).join(""):'<div class="empty">No hay conserjes activos.</div>')+'</div>'+(me.rol=="admin"?'<button class="small" style="margin-top:14px" onclick="soloAdmin()">Entrar solo a administración</button>':'')+E+'</div>'}
else{h='<div class="card" id="pinbox" style="max-width:360px;margin:auto"><b>'+esc(selC.nombre)+'</b><p class="meta">Ingresa tu PIN</p><div class="dots" aria-live="polite">'+(pin?"●".repeat(pin.length):"&nbsp;")+'</div><div class="pad">'+["1","2","3","4","5","6","7","8","9","⌫","0","✓"].map(function(k){return '<button class="key" onclick="tecla(\''+k+'\')" aria-label="'+(k=="⌫"?"Borrar":k=="✓"?"Confirmar":k)+'">'+k+'</button>'}).join("")+'</div>'+E+'<button class="small" style="margin-top:10px" onclick="atras()">Cambiar de persona</button></div>'}
m.innerHTML=h}
function elegir(id){selC=cs.filter(function(c){return c.id==id})[0]||null;pin="";terr="";pintaTurno()}
function atras(){selC=null;pin="";terr="";pintaTurno()}
function tecla(k){if(k=="⌫")pin=pin.slice(0,-1);else if(k=="✓"){iniciar();return}else if(pin.length<6)pin+=k;terr="";pintaTurno()}
async function iniciar(){if(busy)return;if(pin.length<4){terr="El PIN tiene entre 4 y 6 dígitos.";pintaTurno();return}busy=true;var r=await sb.rpc("iniciar_turno",{p_conserje_id:selC.id,p_pin:pin});busy=false;pin="";if(r.error){terr=r.error.message;pintaTurno();return}if(!r.data){terr="PIN incorrecto.";pintaTurno();return}enTurno=false;sinTurno=false;tab="visitas";resumen=true;await cargar()}
function soloAdmin(){sinTurno=true;enTurno=false;tab="adm";cargar()}
document.addEventListener("keydown",function(e){if(!enTurno||!selC)return;if(/^\d$/.test(e.key))tecla(e.key);else if(e.key=="Backspace")tecla("⌫");else if(e.key=="Enter")tecla("✓")});
init();
</script></body></html>
