<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conserjería · Cerro Paraíso Uno</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF0F2;--card:#fff;--ink:#14212B;--mut:#5B6B76;--acc:#1F6F8B;--acc-t:#fff;--warn:#C8452D;--line:#CFDAE0;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A22;--card:#18262F;--ink:#E6EEF2;--mut:#93A5B0;--acc:#5BB4D1;--acc-t:#0F1A22;--warn:#F08266;--line:#2A3C47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A22;--card:#18262F;--ink:#E6EEF2;--mut:#93A5B0;--acc:#5BB4D1;--acc-t:#0F1A22;--warn:#F08266;--line:#2A3C47;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Archivo,system-ui,Arial,sans-serif}
header{padding:18px 16px 8px;max-width:720px;margin:auto}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:14px}
nav{display:flex;gap:6px;padding:8px 16px;max-width:720px;margin:auto;overflow-x:auto}
nav button{flex:1;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;border-radius:10px;font:600 14px Archivo,system-ui,sans-serif}
nav button[aria-selected="true"]{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:720px;margin:auto;padding:8px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:var(--acc-t);font:800 16px Archivo,system-ui,sans-serif}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--warn);color:#fff}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item b{font-weight:600}.meta{color:var(--mut);font-size:13px}
.chip{font-size:12px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
.chip.on{background:var(--warn);border-color:var(--warn);color:#fff}
.small{padding:8px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;font:600 13px Archivo,system-ui,sans-serif}
.empty{color:var(--mut);padding:8px 0}
.search{margin-bottom:12px}
.tabs-hidden{display:none}
</style></head>
<style>header,nav,main{max-width:1040px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}header .small{white-space:nowrap}input,select,textarea{font-size:17px;padding:12px}.btn{padding:15px}.small{padding:10px 14px;font-size:14px}.item{padding:14px 0}nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}nav button{padding:13px 12px;font-size:15px}.badge{display:inline-block;min-width:22px;margin-left:6px;padding:0 6px;border-radius:20px;background:var(--warn);color:#fff;font-size:13px;line-height:22px}nav button[aria-selected="true"] .badge{background:var(--acc-t);color:var(--acc)}.cols{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}.fcol{position:sticky;top:76px}.dentro{border-left:4px solid var(--acc);padding-left:14px;margin-bottom:6px}.lg{font-size:34px;font-weight:800;line-height:1.1}@media(max-width:820px){.cols{grid-template-columns:1fr}.fcol{position:static}}.hid{display:none}.err{color:var(--warn);font-size:14px;margin-top:8px}.chip.ok{border-color:var(--acc);color:var(--acc)}</style></head>
<body>
<header><div><h1>Conserjería</h1><div class="sub">Cerro Paraíso Uno · <span id="quien"></span></div></div><button class="small hid" id="so" onclick="salir()">Cerrar sesión</button></header>
<nav role="tablist" id="nav" class="hid"></nav>
<main id="main"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
var SUPABASE_URL="https://fyshckhuqvyhximxzyds.supabase.co",SUPABASE_KEY="sb_publishable_LU0kAGYTW_eQXkwgtFvgbg_5bEyn2ag";
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),me=null,tab="visitas",q="",D={v:[],e:[],b:[],deptos:[],dias:90},err="";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(t){var d=new Date(t);return d.toLocaleDateString("es-CL",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"})}
function val(id){return document.getElementById(id).value.trim()}
function by(x){return x.perfiles?esc(x.perfiles.nombre):""}
async function init(){var s=await sb.auth.getSession();if(s.data.session)await entrar();else login()}
function login(){me=null;document.getElementById("so").className="small hid";document.getElementById("quien").textContent="";document.getElementById("nav").className="hid";document.getElementById("main").innerHTML='<div class="card"><label for="em">Correo</label><input id="em" type="email" autocomplete="username"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" onclick="ingresar()">Ingresar</button><div class="err" id="er"></div></div>'}
async function ingresar(){var r=await sb.auth.signInWithPassword({email:val("em"),password:document.getElementById("pw").value});if(r.error){document.getElementById("er").textContent="Correo o contraseña incorrectos.";return}entrar()}
async function entrar(){var u=(await sb.auth.getUser()).data.user,p=await sb.from("perfiles").select("*").eq("id",u.id).single();if(p.error||!p.data){document.getElementById("main").innerHTML='<div class="card">Tu usuario aún no tiene perfil. Pide a administración que lo active.</div>';return}me=p.data;document.getElementById("quien").textContent=me.nombre+" · "+me.rol;document.getElementById("nav").className="";document.getElementById("so").className="small";await cargar();setInterval(function(){if(me&&document.activeElement.tagName!="INPUT"&&document.activeElement.tagName!="TEXTAREA")cargar()},30000)}
async function cargar(){var r=await Promise.all([sb.from("visitas").select("*,perfiles(nombre)").eq("anulada",false).order("entrada",{ascending:false}).limit(200),sb.from("encomiendas").select("*,perfiles(nombre)").eq("anulada",false).order("recibida",{ascending:false}).limit(200),sb.from("bitacora").select("*,perfiles(nombre)").eq("anulada",false).order("creado",{ascending:false}).limit(200),sb.from("deptos").select("numero").order("numero"),sb.from("config").select("dias").single()]);D.v=r[0].data||[];D.e=r[1].data||[];D.b=r[2].data||[];D.deptos=(r[3].data||[]).map(function(x){return x.numero});D.dias=r[4].data?r[4].data.dias:90;render()}
function setTab(t){tab=t;q="";err="";render()}
function nav(){var T=[["visitas","Visitas"],["paq","Encomiendas"],["bit","Bitácora"]];if(me.rol=="admin")T.push(["adm","Admin"]);document.getElementById("nav").innerHTML=T.map(function(t){var n=t[0]=="visitas"?D.v.filter(function(x){return!x.salida}).length:t[0]=="paq"?D.e.filter(function(x){return!x.retirada}).length:0;return '<button role="tab" aria-selected="'+(t[0]==tab)+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+(n?'<span class="badge">'+n+'</span>':'')+'</button>'}).join("")}
function hit(l){if(!q)return l;var s=q.toLowerCase();return l.filter(function(x){return JSON.stringify(x).toLowerCase().indexOf(s)>-1})}
function sbx(){return '<input class="search" type="search" placeholder="Buscar" value="'+esc(q)+'" oninput="q=this.value;lista()" aria-label="Buscar">'}
function dl(){return '<datalist id="dl">'+D.deptos.map(function(d){return '<option value="'+esc(d)+'">'}).join("")+'</datalist>'}
function anu(t,id,sub){return '<button class="small" onclick="anular(\''+t+'\',\''+id+'\')">Anular</button>'}
function vItem(v){return '<div class="item"><div><b>'+esc(v.nombre)+'</b> → depto '+esc(v.depto)+'<div class="meta">'+fmt(v.entrada)+(v.motivo?" · "+esc(v.motivo):"")+(v.salida?" · salió "+fmt(v.salida):"")+" · "+by(v)+'</div></div><div>'+(v.salida?'':'<button class="small" onclick="salida(\''+v.id+'\')">Salida</button> ')+anu("visitas",v.id)+'</div></div>'}
function lista(){var el=document.getElementById("lista");if(!el)return;var h="";
if(tab=="visitas"){var dentro=D.v.filter(function(v){return!v.salida}),hist=hit(D.v);h='<div class="dentro"><div class="lg">'+dentro.length+'</div><b>Dentro ahora</b>'+(dentro.length?dentro.map(vItem).join(""):'<div class="empty">Nadie dentro.</div>')+'</div>'+'<hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><b>Historial</b>'+(hist.length?hist.map(vItem).join(""):'<div class="empty">Sin resultados.</div>')}
if(tab=="paq"){var l=hit(D.e);h=l.length?l.map(function(p){return '<div class="item"><div><b>Depto '+esc(p.depto)+'</b> '+(p.retirada?'<span class="chip ok">Retirada</span>':'<span class="chip on">Pendiente</span>')+'<div class="meta">'+esc(p.remitente||"Sin remitente")+" · "+fmt(p.recibida)+(p.retirada?" · retirada "+fmt(p.retirada):"")+(p.nota?" · "+esc(p.nota):"")+" · "+by(p)+'</div></div><div>'+(p.retirada?'':'<button class="small" onclick="retirar(\''+p.id+'\')">Retirada</button> ')+anu("encomiendas",p.id)+'</div></div>'}).join(""):'<div class="empty">Sin encomiendas.</div>'}
if(tab=="bit"){var b=hit(D.b);h=b.length?b.map(function(x){return '<div class="item"><div><b>'+esc(x.texto)+'</b><div class="meta">'+fmt(x.creado)+" · "+esc(x.tipo)+" · "+by(x)+'</div></div>'+anu("bitacora",x.id)+'</div>'}).join(""):'<div class="empty">Sin novedades.</div>'}
el.innerHTML=h}
function render(){if(!me)return;nav();var m=document.getElementById("main"),h="",E='<div class="err">'+esc(err)+'</div>';
if(tab=="visitas")h='<div class="cols"><div class="fcol"><div class="card"><label for="n">Nombre de la visita</label><input id="n" autocomplete="off" placeholder="Ej: María Soto"><div class="row"><div><label for="d">Departamento</label><input id="d" list="dl" inputmode="numeric" placeholder="Ej: 101"></div><div><label for="mo">Motivo (opcional)</label><input id="mo"></div></div><button class="btn" onclick="addV()">Registrar ingreso</button>'+E+'</div></div><div class="lcol">'+dl()+sbx()+'<div class="card" id="lista"></div></div></div>';
if(tab=="paq")h='<div class="cols"><div class="fcol"><div class="card"><div class="row"><div><label for="d">Departamento</label><input id="d" list="dl" inputmode="numeric" placeholder="Ej: 101"></div><div><label for="r">Remitente o empresa</label><input id="r"></div></div><label for="o">Nota (opcional)</label><input id="o"><button class="btn" onclick="addP()">Registrar encomienda</button>'+E+'</div></div><div class="lcol">'+dl()+sbx()+'<div class="card" id="lista"></div></div></div>';
if(tab=="bit")h='<div class="cols"><div class="fcol"><div class="card"><label for="tp">Tipo</label><select id="tp"><option>Novedad</option><option>Incidencia</option><option>Ronda</option><option>Traspaso de turno</option></select><label for="x">Detalle</label><textarea id="x" rows="3"></textarea><button class="btn" onclick="addB()">Guardar en bitácora</button>'+E+'</div></div><div class="lcol">'+sbx()+'<div class="card" id="lista"></div></div></div>';
if(tab=="adm")h='<div class="card"><b>Departamentos ('+D.deptos.length+')</b><p class="meta">Agrega varios separados por coma, por ejemplo: 101,102,103</p><input id="nd"><button class="btn" onclick="addD()">Agregar departamentos</button></div><div class="card"><b>Retención</b><p class="meta">Se purgan solo visitas con salida, encomiendas retiradas y bitácora. Define el plazo con la administración.</p><select id="dias" onchange="setDias(this.value)">'+[30,60,90,180].map(function(d){return '<option value="'+d+'"'+(d==D.dias?' selected':'')+'>'+d+' días</option>'}).join("")+'</select></div><div class="card"><button class="btn sec" onclick="exportar()">Exportar respaldo</button></div>'+E;
m.innerHTML=h;lista()}
async function run(p){var r=await p;if(r.error){err="No se pudo guardar: "+r.error.message}else err="";await cargar();return r}
function addV(){var n=val("n"),d=val("d");if(!n||!d){err="Falta el nombre o el departamento.";render();return}run(sb.from("visitas").insert({nombre:n,depto:d,motivo:val("mo")||null}))}
function addP(){var d=val("d");if(!d){err="Falta el departamento.";render();return}run(sb.from("encomiendas").insert({depto:d,remitente:val("r")||null,nota:val("o")||null}))}
function addB(){var x=val("x");if(!x){err="Escribe el detalle.";render();return}run(sb.from("bitacora").insert({tipo:document.getElementById("tp").value,texto:x}))}
function salida(id){run(sb.from("visitas").update({salida:new Date().toISOString()}).eq("id",id))}
function retirar(id){run(sb.from("encomiendas").update({retirada:new Date().toISOString()}).eq("id",id))}
function anular(t,id){var m=prompt("Motivo de la anulación (queda registrado):");if(!m)return;run(sb.from(t).update({anulada:true,motivo_anulacion:m}).eq("id",id))}
function addD(){var l=val("nd").split(",").map(function(s){return s.trim()}).filter(Boolean).map(function(n){return{numero:n}});if(l.length)run(sb.from("deptos").upsert(l))}
function setDias(v){run(sb.from("config").update({dias:+v}).eq("id",1))}
async function exportar(){var o={};for(var t of["visitas","encomiendas","bitacora"])o[t]=(await sb.from(t).select("*")).data;var a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(o,null,1));a.download="conserjeria-respaldo.json";a.click()}
async function salir(){await sb.auth.signOut();login()}
init();
</script></body></html>
